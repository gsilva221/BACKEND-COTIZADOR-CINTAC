<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión del cotizador CINTAC.">
    <title>Iniciar sesión | CINTAC</title>
    <link rel="stylesheet" href="{% static 'CSS/cintac.css' %}">
</head>
<body class="login-page">
    <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
            <a class="brand login-brand" href="/" aria-label="CINTAC inicio">
                <img src="{% static 'images/MainCintac/logo.jpg' %}" alt="CINTAC">
            </a>
            <p class="eyebrow orange">COTIZADOR CINTAC</p>
            <h1 id="login-title">Iniciar sesión</h1>
            <p class="login-intro">Ingresa tus datos para continuar.</p>

            {% if error %}
                <p role="alert" style="color: red;">{{ error }}</p>
            {% endif %}

            <form class="login-form" method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="login-field">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="dark-button login-submit" type="submit">Ingresar <span>↗</span></button>
            </form>
        </section>
    </main>
</body>
</html>
